name: Build Installers

# a manual run just builds; a v* tag also publishes a GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # each installer builds on its own native runner, so no cross-compilation or Wine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # babel strips types without checking them, so nothing else would stop a type error or a failing theme shipping
      - name: Lint, typecheck and audit the themes
        run: yarn lint:all

      - name: Build the web bundle
        run: yarn build

      - name: Package the installer
        run: yarn electron-builder --${{ matrix.platform }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no Apple Developer cert; unsigned is fine for personal use
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # kept 90 days, for grabbing a test build without cutting a release
      - name: Upload the installer
        uses: actions/upload-artifact@v5
        with:
          name: tsukamae-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: ignore
